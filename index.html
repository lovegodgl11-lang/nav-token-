<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Nav token </title><meta name="title" content="Nav token "><meta name="description" content="Update version count down "><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Token Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>


    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm mx-auto bg-white p-8 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-2">Check Your Token</h2>
            <p class="text-center text-gray-600 mb-6">Enter the mobile number you provided at the reception.</p>
            <form id="login-form">
                <div class="mb-4">
                    <label for="mobile-number" class="block text-sm font-medium text-gray-700">Mobile Number</label>
                    <input type="tel" id="mobile-number" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" placeholder="e.g., 9876543210">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-semibold">Check Status</button>
            </form>
             <p class="text-center text-xs text-gray-400 mt-4"><a href="Pc.html" class="hover:underline">Back to Project Hub</a></p>
        </div>
    </div>
    
    <div id="main-view" class="hidden w-full max-w-md mx-auto p-4 pt-12 text-center">
        <header class="mb-8">
            <h1 class="text-xl font-bold">Welcome, <span id="customer-name-display"></span>!</h1>
            <p class="text-gray-600">Here is your current queue status.</p>
        </header>
        
        <div id="status-content" class="space-y-6">
             <div class="bg-white p-6 rounded-lg shadow-md">
                <p class="text-sm font-semibold text-gray-500">Currently Serving</p>
                <p id="serving-token" class="text-6xl font-extrabold text-green-600">--</p>
            </div>
             <div class="bg-indigo-600 text-white p-8 rounded-lg shadow-xl">
                <p class="text-lg font-semibold text-indigo-200">Your Token Number</p>
                <p id="my-token" class="text-8xl font-extrabold">--</p>
            </div>
             <div class="bg-white p-6 rounded-lg shadow-md">
                <p id="wait-time-message" class="text-sm font-semibold text-gray-500">Estimated Wait Time</p>
                <p id="wait-time-countdown" class="text-6xl font-extrabold text-yellow-600">--:--</p>
            </div>
        </div>

        <div id="my-appointment-details" class="mt-8 text-left bg-white p-4 rounded-lg shadow-sm text-sm">
             <!-- Details injected here -->
        </div>
        
        <button id="logout-btn" class="mt-8 text-sm text-red-500 hover:underline">Check Another Number</button>
    </div>
    
    <audio id="notification-sound" src="https://freesound.org/data/previews/415/415763_6142149-lq.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp"
        };
        
        let db;
        let currentUserMobile = null;
        const AVG_TIME_PER_PERSON = 5; // minutes
        let countdownInterval = null;
        let previousTaskStatusForNotification = null;

        const loginView = document.getElementById('login-view');
        const mainView = document.getElementById('main-view');

        function speak(text, lang = 'en-IN') {
            if (!('speechSynthesis' in window)) {
                console.warn("Speech synthesis not supported.");
                return;
            }
            if (speechSynthesis.getVoices().length === 0) {
                speechSynthesis.onvoiceschanged = () => performSpeak(text, lang);
            } else {
                performSpeak(text, lang);
            }
        }
        
        function performSpeak(text, lang) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 1.0;
            let voices = speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang === lang);
            if (voice) {
                utterance.voice = voice;
            } else {
                console.warn(`Voice for lang ${lang} not found, using default.`);
            }
            speechSynthesis.speak(utterance);
        }

        function playNotification(message, lang = 'hi-IN') {
            document.getElementById('notification-sound').play().catch(e => console.error("Audio playback error:", e));
            speak(message, lang);
        }

        function updateStatusDisplay(queueData, workerTasks) {
            if (countdownInterval) clearInterval(countdownInterval);

            const myQueueItem = Object.values(queueData).find(c => c.customerMobile === currentUserMobile && (c.status === 'waiting' || c.status === 'serving'));
            const servingItem = Object.values(queueData).find(c => c.status === 'serving');
            
            if (!myQueueItem) {
                alert("No active token found for this mobile no. Check mobile no or contact receptionist to receive new token no.");
                document.getElementById('logout-btn').click();
                return;
            }

            const myTask = Object.values(workerTasks).find(t => t.orderId === myQueueItem.id);

            // Check for completion notification
            if (myTask && myTask.status === 'Completed' && previousTaskStatusForNotification !== 'Completed') {
                playNotification("आपका ऑर्डर पूरा हो गया है। आप इसे ले सकते हैं।"); // "Your order is complete. You can collect it."
            }
            previousTaskStatusForNotification = myTask ? myTask.status : null;

            // Handle missed turn
            if (servingItem && myQueueItem.status === 'waiting' && servingItem.tokenNumber > myQueueItem.tokenNumber) {
                document.getElementById('status-content').innerHTML = `
                    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg shadow-md text-left">
                        <h3 class="font-bold text-xl">You Missed Your Turn</h3>
                        <p class="mt-2">Your token #${myQueueItem.tokenNumber} was called.</p>
                        <p>Please contact the receptionist to get a new token.</p>
                    </div>
                `;
                document.getElementById('my-appointment-details').innerHTML = '';
                speak("आपकी बारी निकल गयी है। कृपया नया टोकन लें।");
                return;
            }
            
            document.getElementById('customer-name-display').textContent = myQueueItem.customerName;
            document.getElementById('my-token').textContent = myQueueItem.tokenNumber;
            document.getElementById('serving-token').textContent = servingItem ? servingItem.tokenNumber : '--';
            document.getElementById('my-appointment-details').innerHTML = `<p><strong>Reason:</strong> ${myQueueItem.appointmentFor}</p><p><strong>Time Entered:</strong> ${new Date(myQueueItem.timestamp).toLocaleTimeString()}</p>`;

            const waitTimeCountdownEl = document.getElementById('wait-time-countdown');
            const waitTimeMessageEl = document.getElementById('wait-time-message');


            if (myQueueItem.status === 'serving') {
                if (myTask) {
                    if (myTask.status === 'Completed') {
                        waitTimeCountdownEl.textContent = 'Done!';
                        waitTimeMessageEl.textContent = 'Your item is ready for pickup.';
                    } else if (myTask.eta && myTask.etaSetTimestamp) {
                        waitTimeMessageEl.textContent = 'Estimated Task Time Remaining';
                        startCountdown(0, myTask.eta, myTask.etaSetTimestamp); 
                    } else {
                        waitTimeCountdownEl.textContent = '--:--';
                        waitTimeMessageEl.textContent = 'Waiting for worker to start...';
                    }
                } else {
                    waitTimeCountdownEl.textContent = '00:00';
                    waitTimeMessageEl.textContent = "It's your turn now!";
                    if (!myQueueItem.notified) {
                        playNotification("आपकी बारी आ गई है, कृपया तैयार रहें।");
                        db.ref('tokenQueue/' + myQueueItem.id + '/notified').set(true);
                    }
                }
            } else { // Waiting
                waitTimeMessageEl.textContent = 'Estimated Wait Time';
                let totalWaitSeconds = 0;

                if (servingItem) {
                    const servingTask = Object.values(workerTasks).find(t => t.orderId === servingItem.id);
                    if (servingTask && servingTask.eta && servingTask.etaSetTimestamp) {
                        const etaMillis = servingTask.eta * 60 * 1000;
                        const elapsedMillis = Date.now() - servingTask.etaSetTimestamp;
                        totalWaitSeconds += Math.max(0, (etaMillis - elapsedMillis) / 1000);
                    } else {
                        totalWaitSeconds += AVG_TIME_PER_PERSON * 60;
                    }
                }

                const peopleInBetween = Object.values(queueData).filter(c => 
                    c.status === 'waiting' && 
                    c.tokenNumber < myQueueItem.tokenNumber && 
                    (servingItem ? c.tokenNumber > servingItem.tokenNumber : true)
                ).length;
                
                totalWaitSeconds += peopleInBetween * AVG_TIME_PER_PERSON * 60;

                startCountdown(totalWaitSeconds, null, null);
            }
        }
        
        function startCountdown(totalSeconds, etaMinutes = null, etaSetTimestamp = null) {
            const countdownEl = document.getElementById('wait-time-countdown');
            if (!countdownEl) return;
            let remainingSeconds;

            const updateDisplay = () => {
                if (etaMinutes !== null && etaSetTimestamp !== null) {
                    const totalTaskSeconds = etaMinutes * 60;
                    const elapsedSeconds = (Date.now() - etaSetTimestamp) / 1000;
                    remainingSeconds = Math.max(0, totalTaskSeconds - elapsedSeconds);
                } else {
                    remainingSeconds = totalSeconds--;
                }

                if (remainingSeconds <= 0) {
                    if (etaMinutes !== null) {
                        countdownEl.textContent = 'Overdue';
                        document.getElementById('wait-time-message').textContent = 'Task is taking longer than expected.';
                    } else {
                        countdownEl.textContent = '00:00';
                        document.getElementById('wait-time-message').textContent = 'Your turn is very soon!';
                    }
                    clearInterval(countdownInterval);
                    return;
                }
                const minutes = Math.floor(remainingSeconds / 60);
                const secs = Math.floor(remainingSeconds % 60);
                countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 1000);
        }
        
        function startQueueListener(mobile) {
            currentUserMobile = mobile;
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const queueData = data.tokenQueue || {};
                const workerTasks = data.workerTasks || {};
                updateStatusDisplay(queueData, workerTasks);
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the service.");
            }
            
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const mobile = document.getElementById('mobile-number').value.trim();
                if (/^\d{10}$/.test(mobile)) {
                    loginView.classList.add('hidden');
                    mainView.classList.remove('hidden');
                    startQueueListener(mobile);
                } else {
                    alert("Please enter a valid 10-digit mobile number.");
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                if (currentUserMobile) {
                    db.ref().off(); // Detach all listeners on the root ref
                }
                if (countdownInterval) clearInterval(countdownInterval);
                currentUserMobile = null;
                previousTaskStatusForNotification = null;
                mainView.classList.add('hidden');
                loginView.classList.remove('hidden');
                document.getElementById('login-form').reset();
            });
        });
    </script>


  <script src="./script.js"></script></body></html>
