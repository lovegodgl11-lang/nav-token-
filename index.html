<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Nav token </title><meta name="title" content="Nav token "><meta name="description" content="Chat msg to admin "><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>




    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Token Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        #notification-badge, #inbox-badge { top: -4px; right: -4px; }
        .notification-dropdown { display: none; }
        .notification-dropdown.show { display: block; }
        .notification-item.unread { background-color: #eef2ff; }
        .hidden { display: none; }
        .modal { background-color: rgba(0,0,0,0.5); }
    </style>


    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm mx-auto bg-white p-8 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-2">Check Your Token</h2>
            <p class="text-center text-gray-600 mb-6">Enter the mobile number you provided at the reception.</p>
            <form id="login-form">
                <div class="mb-4">
                    <label for="mobile-number" class="block text-sm font-medium text-gray-700">Mobile Number</label>
                    <input type="tel" id="mobile-number" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required="" placeholder="e.g., 9876543210">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-semibold">Check Status</button>
            </form>
            <p class="text-center text-sm mt-6">
                Having trouble? <button id="urgent-chat-btn" class="font-semibold text-indigo-600 hover:underline">Chat with Admin</button>
            </p>
             <p class="text-center text-xs text-gray-400 mt-4"><a href="Pc.html" class="hover:underline">Back to Project Hub</a></p>
        </div>
    </div>
    
    <div id="main-view" class="hidden w-full max-w-md mx-auto p-4 pt-8 text-center">
        <header class="flex justify-between items-center mb-8 pb-4 border-b">
            <div>
                <h1 class="text-xl font-bold text-left">Welcome, <span id="customer-name-display"></span>!</h1>
                <p class="text-gray-600 text-left text-sm">Here is your current queue status.</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <button id="notification-bell" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="notification-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                    <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl hidden z-20 border max-h-96 overflow-y-auto">
                        <!-- Notifications will be rendered here -->
                    </div>
                </div>
                 <div class="relative">
                    <button id="inbox-icon" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <span id="inbox-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                </div>
                <button id="logout-btn" class="text-sm text-red-500 hover:underline">Logout</button>
            </div>
        </header>
        
        <div id="status-content" class="space-y-6">
             <div class="bg-white p-6 rounded-lg shadow-md">
                <p class="text-sm font-semibold text-gray-500">Currently Serving</p>
                <p id="serving-token" class="text-6xl font-extrabold text-green-600">--</p>
            </div>
             <div class="bg-indigo-600 text-white p-8 rounded-lg shadow-xl">
                <p class="text-lg font-semibold text-indigo-200">Your Token Number</p>
                <p id="my-token" class="text-8xl font-extrabold">--</p>
            </div>
             <div class="bg-white p-6 rounded-lg shadow-md">
                <p id="wait-time-message" class="text-sm font-semibold text-gray-500">Estimated Wait Time</p>
                <p id="wait-time-countdown" class="text-6xl font-extrabold text-yellow-600">--:--</p>
            </div>
        </div>

        <div id="my-appointment-details" class="mt-8 text-left bg-white p-4 rounded-lg shadow-sm text-sm">
             <!-- Details injected here -->
        </div>
    </div>
    
    <div id="inbox-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">Message Inbox</h3>
                <button id="inbox-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl">×</button>
            </div>
            <div id="inbox-list" class="overflow-y-auto p-2">
                <!-- Messages will be rendered here as a table -->
            </div>
        </div>
    </div>

    <div id="urgent-chat-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden modal">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">Send Urgent Message to Admin</h3>
                <button id="urgent-chat-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl">×</button>
            </div>
            <form id="urgent-chat-form" class="p-6 space-y-4">
                <div>
                    <label for="urgent-name" class="block text-sm font-medium text-gray-700">Your Name</label>
                    <input type="text" id="urgent-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required="">
                </div>
                <div>
                    <label for="urgent-mobile" class="block text-sm font-medium text-gray-700">Your Mobile Number</label>
                    <input type="tel" id="urgent-mobile" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required="">
                </div>
                <div>
                    <label for="urgent-message" class="block text-sm font-medium text-gray-700">Message</label>
                    <textarea id="urgent-message" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md" required="" placeholder="e.g., I need a token urgently but I'm getting an error."></textarea>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 font-semibold">Send Urgent Message</button>
            </form>
        </div>
    </div>

    <audio id="notification-sound" src="https://freesound.org/data/previews/415/415763_6142149-lq.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp"
        };
        
        let db;
        let currentUserMobile = null;
        const AVG_TIME_PER_PERSON = 5; // minutes
        let countdownInterval = null;
        let previousTaskStatusForNotification = null;
        let previousQueueStatusForNotification = null;

        let notifications = [];
        let unreadCount = 0;
        let inboxUnreadCount = 0;

        const loginView = document.getElementById('login-view');
        const mainView = document.getElementById('main-view');

        // --- NOTIFICATION SYSTEM ---
        function addNotification(message, shouldSpeak = false, options = {}) {
            notifications.unshift({ id: Date.now(), message, read: false, timestamp: new Date(), ...options });
            unreadCount++;
            inboxUnreadCount++;
            updateNotificationUI();
            updateInboxBadge();
            renderInbox();
            if (shouldSpeak) {
                playNotification(message);
            }
        }

        function updateNotificationUI() {
            const badge = document.getElementById('notification-badge');
            badge.textContent = unreadCount;
            badge.classList.toggle('hidden', unreadCount === 0);
            renderNotifications();
        }

        function renderNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            if (notifications.length === 0) {
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500">No notifications</p>`;
            } else {
                 dropdown.innerHTML = notifications.map(n => `
                    <div class="p-3 border-b text-sm ${!n.read ? 'unread font-semibold' : 'text-gray-600'}">
                        ${n.message}
                    </div>
                `).join('');
            }
        }

        function updateInboxBadge() {
            const badge = document.getElementById('inbox-badge');
            badge.textContent = inboxUnreadCount;
            badge.classList.toggle('hidden', inboxUnreadCount === 0);
        }

        function renderInbox() {
            const inboxList = document.getElementById('inbox-list');
            if (notifications.length === 0) {
                inboxList.innerHTML = `<p class="p-8 text-center text-gray-500">Your inbox is empty.</p>`;
                return;
            }
            inboxList.innerHTML = `
                <table class="w-full text-sm">
                    <tbody>
                        ${notifications.map(n => `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3">
                                    <p class="${!n.read ? 'font-semibold' : ''}">${n.message}</p>
                                    <p class="text-xs text-gray-500">${n.timestamp.toLocaleString()}</p>
                                </td>
                                <td class="p-3 text-right">
                                    <button onclick="deleteNotification(${n.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Remove</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function deleteNotification(id) {
            const index = notifications.findIndex(n => n.id === id);
            if (index > -1) {
                notifications.splice(index, 1);
                unreadCount = notifications.filter(n => !n.read).length;
                inboxUnreadCount = unreadCount;
                updateNotificationUI();
                updateInboxBadge();
                renderInbox();
            }
        }

        function speak(text, lang = 'en-IN') {
            if (!('speechSynthesis' in window)) {
                console.warn("Speech synthesis not supported.");
                return;
            }
            if (speechSynthesis.getVoices().length === 0) {
                speechSynthesis.onvoiceschanged = () => performSpeak(text, lang);
            } else {
                performSpeak(text, lang);
            }
        }
        
        function performSpeak(text, lang) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 1.0;
            let voices = speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang === lang);
            if (voice) {
                utterance.voice = voice;
            } else {
                console.warn(`Voice for lang ${lang} not found, using default.`);
            }
            speechSynthesis.speak(utterance);
        }

        function playNotification(message, lang = 'hi-IN') {
            document.getElementById('notification-sound').play().catch(e => console.error("Audio playback error:", e));
            speak(message, lang);
        }

        function updateStatusDisplay(queueData, workerTasks) {
            if (countdownInterval) clearInterval(countdownInterval);

            const myQueueItem = Object.values(queueData).find(c => c.customerMobile === currentUserMobile && (c.status === 'waiting' || c.status === 'serving'));
            const servingItem = Object.values(queueData).find(c => c.status === 'serving');
            
            if (!myQueueItem) {
                alert("No active token found for this mobile no. Check mobile no or contact receptionist to receive new token no.");
                document.getElementById('logout-btn').click();
                return;
            }

            const myTask = Object.values(workerTasks).find(t => t.orderId === myQueueItem.id);

            // Check for completion notification
            if (myTask && myTask.status === 'Completed' && previousTaskStatusForNotification !== 'Completed') {
                const msg = "Your item is ready for pickup.";
                playNotification("आपका ऑर्डर पूरा हो गया है। आप इसे ले सकते हैं।");
                addNotification(msg, false, { orderId: myQueueItem.id });
            }
            if (myTask && myTask.status === 'In Progress' && previousTaskStatusForNotification !== 'In Progress') {
                 addNotification("A worker has started on your item.", false, { orderId: myQueueItem.id });
            }
            previousTaskStatusForNotification = myTask ? myTask.status : null;

            // Handle missed turn
            if (servingItem && myQueueItem.status === 'waiting' && servingItem.tokenNumber > myQueueItem.tokenNumber) {
                document.getElementById('status-content').innerHTML = `
                    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg shadow-md text-left">
                        <h3 class="font-bold text-xl">You Missed Your Turn</h3>
                        <p class="mt-2">Your token #${myQueueItem.tokenNumber} was called.</p>
                        <p>Please contact the receptionist to get a new token.</p>
                    </div>
                `;
                document.getElementById('my-appointment-details').innerHTML = '';
                if (previousQueueStatusForNotification !== 'missed') {
                    speak("आपकी बारी निकल गयी है। कृपया नया टोकन लें।");
                    addNotification("You missed your turn! Please get a new token.", false, { orderId: myQueueItem.id });
                }
                previousQueueStatusForNotification = 'missed';
                return;
            }
            
            document.getElementById('customer-name-display').textContent = myQueueItem.customerName;
            document.getElementById('my-token').textContent = myQueueItem.tokenNumber;
            document.getElementById('serving-token').textContent = servingItem ? servingItem.tokenNumber : '--';
            document.getElementById('my-appointment-details').innerHTML = `<p><strong>Reason:</strong> ${myQueueItem.appointmentFor}</p><p><strong>Time Entered:</strong> ${new Date(myQueueItem.timestamp).toLocaleTimeString()}</p>`;

            const waitTimeCountdownEl = document.getElementById('wait-time-countdown');
            const waitTimeMessageEl = document.getElementById('wait-time-message');


            if (myQueueItem.status === 'serving') {
                if (myTask) {
                    if (myTask.status === 'Completed') {
                        waitTimeCountdownEl.textContent = 'Done!';
                        waitTimeMessageEl.textContent = 'Your item is ready for pickup.';
                    } else if (myTask.eta && myTask.etaSetTimestamp) {
                        waitTimeMessageEl.textContent = 'Estimated Task Time Remaining';
                        startCountdown(0, myTask.eta, myTask.etaSetTimestamp); 
                    } else {
                        waitTimeCountdownEl.textContent = '--:--';
                        waitTimeMessageEl.textContent = 'Waiting for worker to start...';
                    }
                } else {
                    waitTimeCountdownEl.textContent = '00:00';
                    waitTimeMessageEl.textContent = "It's your turn now!";
                    if (!myQueueItem.notified) {
                        const msg = "It's your turn now!";
                        playNotification("आपकी बारी आ गई है, कृपया तैयार रहें।");
                        addNotification(msg, false, { orderId: myQueueItem.id });
                        db.ref('tokenQueue/' + myQueueItem.id + '/notified').set(true);
                    }
                }
            } else { // Waiting
                waitTimeMessageEl.textContent = 'Estimated Wait Time';
                let totalWaitSeconds = 0;

                if (servingItem) {
                    const servingTask = Object.values(workerTasks).find(t => t.orderId === servingItem.id);
                    if (servingTask && servingTask.eta && servingTask.etaSetTimestamp) {
                        const etaMillis = servingTask.eta * 60 * 1000;
                        const elapsedMillis = Date.now() - servingTask.etaSetTimestamp;
                        totalWaitSeconds += Math.max(0, (etaMillis - elapsedMillis) / 1000);
                    } else {
                        totalWaitSeconds += AVG_TIME_PER_PERSON * 60;
                    }
                }

                const peopleInBetween = Object.values(queueData).filter(c => 
                    c.status === 'waiting' && 
                    c.tokenNumber < myQueueItem.tokenNumber && 
                    (servingItem ? c.tokenNumber > servingItem.tokenNumber : true)
                ).length;
                
                totalWaitSeconds += peopleInBetween * AVG_TIME_PER_PERSON * 60;

                startCountdown(totalWaitSeconds, null, null);
            }
            previousQueueStatusForNotification = myQueueItem.status;
        }
        
        function startCountdown(totalSeconds, etaMinutes = null, etaSetTimestamp = null) {
            const countdownEl = document.getElementById('wait-time-countdown');
            if (!countdownEl) return;
            let remainingSeconds;

            const updateDisplay = () => {
                if (etaMinutes !== null && etaSetTimestamp !== null) {
                    const totalTaskSeconds = etaMinutes * 60;
                    const elapsedSeconds = (Date.now() - etaSetTimestamp) / 1000;
                    remainingSeconds = Math.max(0, totalTaskSeconds - elapsedSeconds);
                } else {
                    remainingSeconds = totalSeconds--;
                }

                if (remainingSeconds <= 0) {
                    if (etaMinutes !== null) {
                        countdownEl.textContent = 'Overdue';
                        document.getElementById('wait-time-message').textContent = 'Task is taking longer than expected.';
                    } else {
                        countdownEl.textContent = '00:00';
                        document.getElementById('wait-time-message').textContent = 'Your turn is very soon!';
                    }
                    clearInterval(countdownInterval);
                    return;
                }
                const minutes = Math.floor(remainingSeconds / 60);
                const secs = Math.floor(remainingSeconds % 60);
                countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 1000);
        }
        
        function startQueueListener(mobile) {
            currentUserMobile = mobile;
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const queueData = data.tokenQueue || {};
                const workerTasks = data.workerTasks || {};

                // --- AUTOMATIC NOTIFICATION CLEANUP ---
                const myQueueItem = Object.values(queueData).find(c => c.customerMobile === currentUserMobile && (c.status === 'waiting' || c.status === 'serving'));
                if (!myQueueItem && notifications.length > 0) {
                    // If my token is no longer in the active queue, clear notifications.
                    notifications = [];
                    unreadCount = 0;
                    inboxUnreadCount = 0;
                    updateNotificationUI();
                    updateInboxBadge();
                    renderInbox();
                }
                // --- END CLEANUP ---

                updateStatusDisplay(queueData, workerTasks);
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the service.");
            }
            
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const mobile = document.getElementById('mobile-number').value.trim();
                if (/^\d{10}$/.test(mobile)) {
                    loginView.classList.add('hidden');
                    mainView.classList.remove('hidden');
                    startQueueListener(mobile);
                } else {
                    alert("Please enter a valid 10-digit mobile number.");
                }
            });

            document.getElementById('logout-btn').addEventListener('click', () => {
                if (currentUserMobile) {
                    db.ref().off(); // Detach all listeners on the root ref
                }
                if (countdownInterval) clearInterval(countdownInterval);
                currentUserMobile = null;
                previousTaskStatusForNotification = null;
                previousQueueStatusForNotification = null;
                notifications = [];
                unreadCount = 0;
                inboxUnreadCount = 0;
                updateNotificationUI();
                updateInboxBadge();
                renderInbox();
                mainView.classList.add('hidden');
                loginView.classList.remove('hidden');
                document.getElementById('login-form').reset();
                // Restore original status content in case it was replaced by 'missed turn' message
                document.getElementById('status-content').innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <p class="text-sm font-semibold text-gray-500">Currently Serving</p>
                        <p id="serving-token" class="text-6xl font-extrabold text-green-600">--</p>
                    </div>
                    <div class="bg-indigo-600 text-white p-8 rounded-lg shadow-xl">
                        <p class="text-lg font-semibold text-indigo-200">Your Token Number</p>
                        <p id="my-token" class="text-8xl font-extrabold">--</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <p id="wait-time-message" class="text-sm font-semibold text-gray-500">Estimated Wait Time</p>
                        <p id="wait-time-countdown" class="text-6xl font-extrabold text-yellow-600">--:--</p>
                    </div>
                `;
            });

            // Notification Bell Listener
            const bell = document.getElementById('notification-bell');
            const dropdown = document.getElementById('notification-dropdown');
            bell.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('show');
                if (dropdown.classList.contains('show')) {
                    unreadCount = 0;
                    notifications.forEach(n => n.read = true);
                    updateNotificationUI();
                }
            });
            document.addEventListener('click', (e) => {
                if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });

            // Inbox Listeners
            const inboxIcon = document.getElementById('inbox-icon');
            const inboxModal = document.getElementById('inbox-modal');
            const inboxCloseBtn = document.getElementById('inbox-close-btn');

            inboxIcon.addEventListener('click', () => {
                inboxModal.classList.remove('hidden');
                inboxUnreadCount = 0;
                updateInboxBadge();
            });

            inboxCloseBtn.addEventListener('click', () => {
                inboxModal.classList.add('hidden');
            });

            // Urgent Chat Listeners
            const urgentChatBtn = document.getElementById('urgent-chat-btn');
            const urgentChatModal = document.getElementById('urgent-chat-modal');
            const urgentChatCloseBtn = document.getElementById('urgent-chat-close-btn');
            const urgentChatForm = document.getElementById('urgent-chat-form');

            urgentChatBtn.addEventListener('click', () => urgentChatModal.classList.remove('hidden'));
            urgentChatCloseBtn.addEventListener('click', () => urgentChatModal.classList.add('hidden'));
            
            urgentChatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('urgent-name').value.trim();
                const mobile = document.getElementById('urgent-mobile').value.trim();
                const message = document.getElementById('urgent-message').value.trim();

                if (!name || !mobile || !message) {
                    alert('Please fill all fields.');
                    return;
                }

                try {
                    const urgentRef = db.ref('urgentAdminMessages').push();
                    await urgentRef.set({
                        name, mobile, message,
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        status: 'new'
                    });
                    alert('Your urgent message has been sent to the admin.');
                    urgentChatForm.reset();
                    urgentChatModal.classList.add('hidden');
                } catch (error) {
                    console.error('Failed to send urgent message:', error);
                    alert('Could not send message. Please try again.');
                }
            });
        });

        window.deleteNotification = deleteNotification;
    </script>

<script src="./script.js"></script></body></html>
